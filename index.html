<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1A2233"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Sanam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one calm launcher screen — wordmark and greeting on top, a grid of app tiles below, like a phone home screen */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --ink:#1A2233; --muted:#5E6779; --line:#D9DDE5;
  --gold:#B9842A; --gold-soft:#F3E6CC;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#171E2E; --ink:#ECEFF5; --muted:#9AA3B5; --line:#283147;
  --gold:#E2B15B; --gold-soft:#3A2F1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#171E2E; --ink:#ECEFF5; --muted:#9AA3B5; --line:#283147;
  --gold:#E2B15B; --gold-soft:#3A2F1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:32px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:12px}
.mark svg{width:52px;height:52px;flex:none}
.word{display:flex;flex-direction:column;line-height:1.1}
.word b{font-family:"Montserrat",var(--display);font-weight:700;font-size:30px;letter-spacing:.12em;direction:ltr}
.word span{font-family:var(--display);font-size:14px;color:var(--gold);font-weight:500;text-align:right}
.edit{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.edit:hover,.edit[aria-pressed="true"]{color:var(--ink);border-color:var(--gold)}
.hello h1{font-family:var(--body);font-weight:600;font-size:clamp(22px,5vw,30px);margin:0;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 12px 18px;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;color:inherit;text-decoration:none;
  font:inherit;cursor:pointer;transition:transform .15s ease,border-color .15s ease}
.tile:hover{transform:translateY(-2px);border-color:var(--gold)}
.tile:focus-visible,.edit:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ico{width:76px;height:76px;border-radius:22px;display:grid;place-items:center}
.ico svg{width:40px;height:40px}
.ico.logo{background:#fff;overflow:hidden;border:1px solid var(--line)}
.ico.logo.full{background:none;border:0}
.ico.logo img{width:100%;height:100%;object-fit:contain;display:block}
.tile .n{font-weight:600;font-size:16px}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:-8px;text-align:center}
.tile .state{position:absolute;top:10px;left:10px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:600}
.add{border-style:dashed;background:transparent}
.add .ico{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.c-crush{background:linear-gradient(145deg,#5B6578,#2E3647);color:#F2E3C4}
.c-khair{background:linear-gradient(145deg,#3E8E5E,#1F5A3B);color:#EAF6D9}
.c-drk{background:linear-gradient(145deg,#2F5FB3,#1B356E);color:#E3ECFF}
.c-cash{background:linear-gradient(145deg,#B5533C,#7A2E1F);color:#FFE9DF}
.c-new{background:linear-gradient(145deg,#C9963F,#8E621C);color:#FFF4DE}
footer{color:var(--muted);font-size:12.5px;text-align:center}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);padding:22px;width:min(420px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,14,24,.45)}
dialog h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 6px}
dialog p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input[dir="ltr"]{text-align:left}
.row{display:flex;gap:8px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:12px;padding:9px 18px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1A1406}
.btn.del{color:#C2453A;border-color:transparent;margin-inline-start:auto}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>

<div class="wrap">
  <header>
    <div class="mark">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="18" fill="var(--ink)"/>
        <circle cx="32" cy="17" r="4" fill="var(--gold)"/>
        <path d="M8 48 C18 48 22 26 32 26 C42 26 46 48 56 48 Z" fill="var(--gold)"/>
        <path d="M8 48 C16 48 20 38 26 38 C30 38 31 44 34 48 Z" fill="var(--bg)" opacity=".35"/>
      </svg>
      <div class="word"><b>SANAM</b><span>سَنام</span></div>
    </div>
    <button class="edit" id="editBtn" aria-pressed="false">تعديل البرامج</button>
  </header>

  <section class="hello">
    <h1 id="greet">أهلًا يا محمد</h1>
    <p id="today"></p>
  </section>

  <section class="grid" id="grid" aria-label="البرامج"></section>

  <footer>SANAM · كل برامجك في مكان واحد</footer>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dTitle">رابط البرنامج</h2>
    <p id="dHint">الصق اللينك اللي بتفتح منه البرنامج في المتصفح.</p>
    <label for="fName">اسم البرنامج</label>
    <input id="fName" required>
    <label for="fSub">وصف قصير</label>
    <input id="fSub">
    <label for="fUrl">اللينك</label>
    <input id="fUrl" dir="ltr" inputmode="url" placeholder="https://...">
    <div class="row">
      <button class="btn pri" value="save">حفظ</button>
      <button class="btn" value="cancel" formnovalidate>إلغاء</button>
      <button class="btn del" value="delete" id="delBtn" formnovalidate>حذف</button>
    </div>
  </form>
</dialog>

const DEFAULTS = [
  {id:"crush", name:"الكسارة", sub:"الإنتاج والحسابات", url:"https://kasara.mohammedelgmahy.workers.dev/", icon:"crush"},
  {id:"khair", name:"خير بلدنا", sub:"برنامج خير بلدنا", url:"https://mohammedelgmahy-netizen.github.io/kheir-bladna/", icon:"khair"},
  {id:"cash", name:"الكاشير", sub:"البيع والفواتير", url:"https://mohammedelgmahy-netizen.github.io/supermarket-cashier/", icon:"cash"},
  {id:"drk", name:"دركسيون", sub:"معرض الفردي", url:"https://mohammedelgmahy-netizen.github.io/dreksyon/", icon:"drk"}
];
const KEY = "sanam-apps-v1";
let apps = load(), editing = false, current = null;

function load(){
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(v) && v.length) { v.forEach(a => { const d = DEFAULTS.find(x => x.id === a.id); if (d && (!a.url || a.url.includes("Yc6DYsYZdDX1VY93pHuXKK"))) a.url = d.url; }); DEFAULTS.forEach(d => { if (!v.some(a => a.id === d.id)) v.push({...d}); }); return v; } } catch(e){}
  return DEFAULTS.map(a => ({...a}));
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(apps)); } catch(e){} }

function render(){
  const g = document.getElementById("grid");
  g.innerHTML = "";
  apps.forEach(a => {
    const el = document.createElement(a.url && !editing ? "a" : "button");
    el.className = "tile";
    if (el.tagName === "A") { el.href = a.url; el.target = "_blank"; el.rel = "noopener"; }
    else el.type = "button", el.onclick = () => openDlg(a);
    el.innerHTML = (LOGOS[a.id] ? `<div class="ico logo${LOGOS[a.id].startsWith("data:image/svg") ? " full" : ""}"><img src="${LOGOS[a.id]}" alt=""></div>` : `<div class="ico c-${ICONS[a.icon] && a.icon !== "plus" ? a.icon : "new"}">${ICONS[a.icon] || ICONS.new}</div>`) + `
      <div class="n"></div><div class="s"></div>${!a.url ? '<span class="state">أضف اللينك</span>' : editing ? '<span class="state">تعديل</span>' : ""}`;
    el.querySelector(".n").textContent = a.name;
    el.querySelector(".s").textContent = a.sub || "";
    g.appendChild(el);
  });
  const add = document.createElement("button");
  add.type = "button"; add.className = "tile add";
  add.innerHTML = `<div class="ico">${ICONS.plus}</div><div class="n">إضافة برنامج</div><div class="s">أي برنامج جديد بلينك</div>`;
  add.onclick = () => openDlg(null);
  g.appendChild(add);
}

function openDlg(a){
  current = a;
  document.getElementById("dTitle").textContent = a ? a.name : "برنامج جديد";
  document.getElementById("fName").value = a ? a.name : "";
  document.getElementById("fSub").value = a ? (a.sub || "") : "";
  document.getElementById("fUrl").value = a ? (a.url || "") : "";
  document.getElementById("delBtn").hidden = !a;
  document.getElementById("dlg").showModal();
}
document.getElementById("dlg").addEventListener("close", e => {
  const v = e.target.returnValue;
  if (v === "save") {
    const name = document.getElementById("fName").value.trim();
    let url = document.getElementById("fUrl").value.trim();
    if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;
    const sub = document.getElementById("fSub").value.trim();
    if (!name) return;
    if (current) Object.assign(current, {name, sub, url});
    else apps.push({id:"a"+Date.now(), name, sub, url, icon:"new"});
    save(); render();
  } else if (v === "delete" && current) {
    apps = apps.filter(x => x !== current); save(); render();
  }
});
document.getElementById("editBtn").onclick = e => {
  editing = !editing;
  e.currentTarget.setAttribute("aria-pressed", editing);
  e.currentTarget.textContent = editing ? "تم" : "تعديل البرامج";
  render();
};

const h = new Date().getHours();
document.getElementById("greet").textContent = (h < 12 ? "صباح الخير" : "مساء الخير") + " يا محمد";
try {
  document.getElementById("today").textContent = new Intl.DateTimeFormat("ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date());
} catch(e){}
render();
</script>
