<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#714b67">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>سنام للمقاولات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fixed navy command rail on the right (RTL), white top bar, card grid on a cool site-grey ground; rail becomes a drawer on phones. */
:root{
  --navy:#0f2742; --navy-2:#173a5e; --gold:#f0b23e; --gold-ink:#9a6510;
  --bg:#eef2f7; --card:#ffffff; --card-2:#f6f8fb; --line:#e3e8ef; --line-2:#d3dbe6;
  --fg:#15212e; --fg-2:#3e4c5c; --muted:#7a8797;
  --blue:#2f6fd6; --blue-t:#e7effc; --green:#16a37b; --green-t:#e2f5ee; --amber:#e8962e; --amber-t:#fdf0dd;
  --violet:#7457d9; --violet-t:#efebfc; --red:#d64545; --red-t:#fbe7e7;
  --c1:#2f6fd6; --c2:#e8962e; --c3:#16a37b; --c4:#9b59d0;
  --rail-fg:#c9d6e4; --rail-dim:#7f95ad; --rail-hover:rgba(255,255,255,.06); --rail-on:rgba(240,178,62,.14);
  --shadow:0 1px 2px rgba(15,39,66,.05),0 6px 20px rgba(15,39,66,.06);
  --on:#0f2742;--btn:#2f6fd6;--k-sky:#0ea5e9;--k-orange:#f97316;--k-amber:#f59e0b;--k-green:#22c55e;--k-teal:#14b8a6;--k-indigo:#6366f1;--k-emerald:#10b981;--k-violet:#a855f7;--k-rose:#e11d48;--k-blue:#3b82f6;--k-slate:#475569;--f:"Cairo",Tahoma,"Segoe UI",sans-serif; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c141d;--card:#141f2b;--card-2:#192635;--line:#223142;--line-2:#2d3f53;--fg:#e8eef5;--fg-2:#b5c2d0;--muted:#8696a8;
  --blue:#6b9ff0;--blue-t:#18294a;--green:#38c597;--green-t:#12332a;--amber:#f0a94a;--amber-t:#3a2a14;--violet:#a08cf0;--violet-t:#271f45;--red:#f07a7a;--red-t:#3d1b1d;
  --c1:#4f8be8;--c2:#c97f25;--c3:#1f9f78;--c4:#a575e0;--gold-ink:#f0b23e;--on:#2f6fd6;--btn:#2f6fd6;--navy:#08121c;--navy-2:#10223a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c141d;--card:#141f2b;--card-2:#192635;--line:#223142;--line-2:#2d3f53;--fg:#e8eef5;--fg-2:#b5c2d0;--muted:#8696a8;
  --blue:#6b9ff0;--blue-t:#18294a;--green:#38c597;--green-t:#12332a;--amber:#f0a94a;--amber-t:#3a2a14;--violet:#a08cf0;--violet-t:#271f45;--red:#f07a7a;--red-t:#3d1b1d;
  --c1:#4f8be8;--c2:#c97f25;--c3:#1f9f78;--c4:#a575e0;--gold-ink:#f0b23e;--on:#2f6fd6;--btn:#2f6fd6;--navy:#08121c;--navy-2:#10223a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14.5px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.cur{font-size:.7em;color:var(--muted);font-weight:600;margin-inline-start:4px}

/* shell */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}
.rail{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:var(--rail-fg);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding-block:calc(18px + env(safe-area-inset-top,0px)) 18px;padding-right:max(14px,env(safe-area-inset-right,0px));padding-left:14px;z-index:30}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#d98a1c);display:grid;place-items:center;color:#1b1206;flex:none;box-shadow:0 6px 14px rgba(240,178,62,.25)}
.logo svg{width:26px;height:26px}
.brand b{display:block;color:#fff;font-size:17px;font-weight:800;line-height:1.3}
.brand small{color:var(--rail-dim);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{color:var(--rail-dim);font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:14px 12px 6px}
.nav button{background:none;border:0;text-align:right;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--rail-fg);display:flex;align-items:center;gap:12px;font-weight:600;font-size:14.5px;position:relative}
.nav button:hover{background:var(--rail-hover);color:#fff}
.nav button[aria-current="page"]{background:var(--rail-on);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;right:-14px;top:8px;bottom:8px;width:4px;border-radius:4px 0 0 4px;background:var(--gold)}
.nav button[aria-current="page"] svg{color:var(--gold)}
.nav .count{margin-inline-start:auto;font-size:11.5px;background:rgba(255,255,255,.08);color:var(--rail-fg);padding:0 8px;border-radius:99px;min-width:24px;text-align:center}
.rail-foot{margin-top:auto;padding:14px 10px 0;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--rail-dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(22,163,123,.25);flex:none}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,178,62,.25)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:28px}
.top h1{font-size:19px;font-weight:800;margin:0;line-height:1.3}
.crumb{color:var(--muted);font-size:12.5px}
.top-actions{margin-inline-start:auto;display:flex;gap:10px;align-items:center}
.today{display:flex;align-items:center;gap:8px;color:var(--fg-2);font-size:13px;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.today svg{width:17px;height:17px;color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:800;flex:none}
.menu-btn{display:none;background:var(--card-2);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;place-items:center;cursor:pointer}
.main{min-width:0}
.content{padding-block:22px 70px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:28px}

/* atoms */
.btn{border:1px solid var(--line-2);background:var(--card);padding:8px 16px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;color:var(--fg)}
.btn svg.i{width:17px;height:17px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--btn);color:#fff;border-color:var(--btn);box-shadow:0 4px 12px rgba(47,111,214,.25)}
.btn.primary:hover{filter:brightness(1.07);color:#fff}
.btn.gold{background:var(--gold);color:#1b1206;border-color:var(--gold)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger.solid{background:var(--red);color:#fff}
.btn.small{padding:4px 10px;font-size:13px;border-radius:8px}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.icon-btn svg.i{width:16px;height:16px}
.icon-btn:hover{color:var(--blue);border-color:var(--blue)}
.icon-btn.del:hover{color:var(--red);border-color:var(--red)}
.link{background:none;border:0;padding:0;color:var(--fg);font-weight:700;cursor:pointer;text-align:right}
.link:hover{color:var(--blue);text-decoration:underline}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card-h h2{font-size:15.5px;font-weight:800;margin:0}
.card-h .sub{margin-inline-start:auto;color:var(--muted);font-size:12.5px}
.card-b{padding:14px 18px 18px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--card-2);color:var(--fg-2);white-space:nowrap}
.pill svg.i{width:13px;height:13px}
.t-blue{background:var(--blue-t);color:var(--blue)} .t-green{background:var(--green-t);color:var(--green)}
.t-amber{background:var(--amber-t);color:var(--gold-ink)} .t-violet{background:var(--violet-t);color:var(--violet)} .t-red{background:var(--red-t);color:var(--red)}
.pos{color:var(--green)} .neg{color:var(--red)}
.muted{color:var(--muted)}
.ava{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who small{display:block;color:var(--muted);font-size:12px;font-weight:500}

/* banner */
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--amber-t);border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);border-radius:12px;padding:12px 16px;margin-bottom:18px;color:var(--fg)}
.banner .row{gap:10px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 60%,#21507d 100%);color:#fff;padding:22px 24px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(270deg,transparent 30%,#000);pointer-events:none}
.hero h2{margin:0;font-size:22px;font-weight:800;line-height:1.4}
.hero p{margin:4px 0 0;color:#c4d3e3;font-size:13.5px}
.hero .big{font-size:30px;font-weight:800;color:var(--gold)}
.hero-stat{position:relative;z-index:1;text-align:left}
.hero-stat small{display:block;color:#c4d3e3;font-size:12.5px}
.hero > div{position:relative;z-index:1}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
.kpi{padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.kpi-top{display:flex;align-items:center;gap:12px}
.kpi-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi-ic svg.i{width:23px;height:23px}
.kpi .l{color:var(--fg-2);font-weight:700;font-size:13.5px}
.kpi .v{font-size:26px;font-weight:800;line-height:1.2}
.kpi .h{font-size:12.5px;color:var(--muted)}
.kpi .h b{font-weight:700}
.meter{height:6px;border-radius:99px;background:var(--card-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-12{grid-column:span 12}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f);font-size:11px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--fg-2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;border-radius:10px;padding:8px 12px;font-size:12.5px;box-shadow:var(--shadow);white-space:nowrap;transform:translate(50%,-110%);z-index:5}
.tip b{display:block;margin-bottom:2px}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--card)}
.split i{display:block;height:100%}
.split i:first-child{border-radius:0 99px 99px 0}.split i:last-child{border-radius:99px 0 0 99px}
.split-rows{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.split-rows .r{display:flex;align-items:center;gap:10px}
.split-rows .r i{width:10px;height:10px;border-radius:3px;flex:none}
.split-rows .r span:last-child{margin-inline-start:auto;font-weight:700}

/* lists */
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0;padding-bottom:0}
.list .amt{font-weight:800}
.proj{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.proj:last-child{border-bottom:0;padding-bottom:0}
.proj-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.proj-h b{font-weight:800}
.proj-m{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.proj-m b{color:var(--fg-2);font-weight:700}

/* tables */
.tbl-wrap{overflow-x:auto}
.card > .tbl-wrap{border-radius:0 0 var(--r) var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-weight:700;color:var(--muted);font-size:12.5px;padding:11px 16px;background:var(--card-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb,var(--blue-t) 45%,transparent)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;background:var(--card-2);border-top:1px solid var(--line-2)}
td.n,th.n{text-align:left}
td.n{font-weight:700}
td.acts{width:1%;white-space:nowrap}
.tbl-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.tbl-top h2{font-size:15px;font-weight:800;margin:0}
.tbl-top .row{margin-inline-start:auto}

.empty{text-align:center;color:var(--muted);padding:34px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .e-ic{width:56px;height:56px;border-radius:16px;background:var(--blue-t);color:var(--blue);display:grid;place-items:center}
.empty .e-ic svg.i{width:28px;height:28px}
.empty b{color:var(--fg);font-size:16px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:13px;font-weight:700;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--on);color:#fff;border-color:var(--on)}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px;padding:14px 16px}
.filters label{display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--muted);gap:4px;min-width:0}
input,select,textarea{background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-t)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-h{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
.page-h p{margin:0;color:var(--muted);font-size:13.5px}
.page-h .row{margin-inline-start:auto}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:right;cursor:pointer;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.quick button:hover{border-color:var(--blue);transform:translateY(-2px)}
.quick .q-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.quick b{display:block;font-size:14px;font-weight:800;line-height:1.35}
.quick small{color:var(--muted);font-size:12px;line-height:1.4;display:block}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.step{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:12px;background:var(--card-2);border:1px solid var(--line)}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--blue-t);color:var(--blue);display:grid;place-items:center;font-weight:800}
.step.done .n{background:var(--green-t);color:var(--green)}
.step b{font-weight:800}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,18,28,.55);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:18px;width:min(680px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.modal-h h3{margin:0;font-size:17px;font-weight:800}
.modal-h .icon-btn{margin-inline-start:auto}
.modal-b{padding:20px 22px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--fg-2);min-width:0}
.form label.full{grid-column:1/-1}
.form .req::after{content:" *";color:var(--red)}
.lines{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.lines-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13.5px}
.line{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:center}
.total-box{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px dashed var(--line-2);font-weight:800}
.total-box .num{font-size:18px;color:var(--blue)}
.modal-f{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line);background:var(--card-2);flex-wrap:wrap}
.err{color:var(--red);font-size:13px;font-weight:700;min-height:1em;margin-top:10px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:12px;z-index:60;font-size:14px;font-weight:700;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px);text-align:center;display:flex;gap:8px;align-items:center}
.toast svg.i{color:var(--gold);width:18px;height:18px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);gap:12px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim-nav{display:none}

/* project cards + site reports */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pcard{overflow:hidden;display:flex;flex-direction:column}

window.SANAM_CFG={url:"https://lhamdnaxioxqptkylvkg.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoYW1kbmF4aW94cXB0a3lsdmtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NjI4NzksImV4cCI6MjEwODAzODg3OX0.ZjyD9sjRqr4DLyvOlSEKQu-2UgMZ0gMgRctoO12iA74",table:"sanam_records",bucket:"sanam-photos"};
(function(){
  const cfg=window.SANAM_CFG,T=cfg.table;let sb=null,me=null,signedIn;
  const ready=new Promise(r=>signedIn=r);
  const cols={};// collection -> {map, subs:[cb]}
  const C=c=>cols[c]||(cols[c]={map:new Map(),subs:[],loaded:false});
  const emit=c=>{const x=C(c);if(!x.loaded)return;const snap={docs:[...x.map.values()].map(r=>({id:r.id,data:()=>r.data}))};x.subs.forEach(f=>f(snap))};
  let live=false;
  function listen(){if(live)return;live=true;
    sb.channel("sanam-all").on("postgres_changes",{event:"*",schema:"public",table:T},p=>{
      const r=p.eventType==="DELETE"?p.old:p.new;if(!r||!r.collection)return;const x=C(r.collection);
      if(p.eventType==="DELETE")x.map.delete(r.id);else x.map.set(r.id,{id:r.id,data:r.data||{}});emit(r.collection)}).subscribe()}
  async function load(c){const x=C(c);let from=0;const page=1000;
    for(;;){const{data,error}=await sb.from(T).select("id,data").eq("collection",c).range(from,from+page-1);if(error)throw error;
      data.forEach(r=>x.map.set(r.id,{id:r.id,data:r.data||{}}));if(data.length<page)break;from+=page}
    x.loaded=true;emit(c)}
  const db={collection:c=>({
    doc:id=>({
      set:async body=>{const{error}=await sb.from(T).upsert({collection:c,id,data:body,updated_at:new Date().toISOString()},{onConflict:"owner,collection,id"});if(error)throw error;C(c).map.set(id,{id,data:body});emit(c)},
      delete:async()=>{const{error}=await sb.from(T).delete().eq("collection",c).eq("id",id);if(error)throw error;C(c).map.delete(id);emit(c)}}),
    onSnapshot:(cb,onErr)=>{C(c).subs.push(cb);listen();load(c).catch(e=>{console.error(e);onErr&&onErr(e)});return()=>{}}})};
  const user={me:async()=>({name:(me&&(me.user_metadata?.name||me.email))||""}),can:async()=>true};
  const downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:"saved"}}};
  const assets={upload:async blob=>{const path=me.id+"/"+new Date().toISOString().slice(0,7)+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2))+".jpg";
    const{error}=await sb.storage.from(cfg.bucket).upload(path,blob,{contentType:blob.type||"image/jpeg"});if(error)throw error;
    return{id:path,url:sb.storage.from(cfg.bucket).getPublicUrl(path).data.publicUrl}}};
  window.sanamLogout=async()=>{await sb.auth.signOut();location.reload()};
  window.claude={use:async n=>{await ready;return n==="db"?db:n==="user"?user:n==="downloads"?downloads:n==="assets"?assets:null}};

  function loginBox(msg){
    const w=document.createElement("div");w.id="sbLogin";w.dir="rtl";
    w.innerHTML=`<form><div class="lg-logo">س</div><h2>سنام للمقاولات</h2><p>سجّل دخولك عشان تفتح البرنامج</p>
      <label>الإيميل<input type="email" name="e" autocomplete="username" required></label>
      <label>كلمة السر<input type="password" name="p" autocomplete="current-password" required></label>
      <div class="lg-err">${msg||""}</div><button type="submit">دخول</button><a href="#" class="lg-sw">أول مرة؟ اعمل حساب جديد</a></form>`;
    document.body.appendChild(w);
    let up=false;const F=w.querySelector("form"),B=F.querySelector("button"),ER=F.querySelector(".lg-err"),SW=F.querySelector(".lg-sw");
    const mode=()=>{B.textContent=up?"إنشاء الحساب":"دخول";SW.textContent=up?"عندي حساب، رجوع للدخول":"أول مرة؟ اعمل حساب جديد";F.querySelector("p").textContent=up?"اعمل حساب جديد بإيميلك (كلمة السر ٦ حروف على الأقل)":"سجّل دخولك عشان تفتح البرنامج";ER.textContent="";ER.style.color=""};
    SW.onclick=e=>{e.preventDefault();up=!up;mode()};
    F.onsubmit=async ev=>{ev.preventDefault();B.disabled=true;B.textContent="لحظة…";ER.textContent="";ER.style.color="";
      const cred={email:F.e.value.trim(),password:F.p.value};
      const{data,error}=up?await sb.auth.signUp(cred):await sb.auth.signInWithPassword(cred);
      B.disabled=false;
      if(error){mode();ER.textContent=/invalid login/i.test(error.message)?"الإيميل أو كلمة السر غلط. لو أول مرة، اعمل حساب جديد من تحت.":/already registered/i.test(error.message)?"الإيميل ده عليه حساب، ادخل بيه.":/at least|weak|short/i.test(error.message)?"كلمة السر قصيرة، خليها ٦ حروف أو أكتر.":/not confirmed/i.test(error.message)?"لسه ما أكدتش الإيميل. افتح رسالة التأكيد اللي وصلتك.":"حصلت مشكلة: "+error.message;return}
      if(up&&!data.session){up=false;mode();ER.style.color="#16a37b";ER.textContent="اتعمل الحساب. افتح الإيميل ودوس على رابط التأكيد، وبعدين ادخل من هنا.";return}
      me=data.user;w.remove();signedIn()}}
  async function start(){
    if(!window.supabase||cfg.url.startsWith("__")){loginBox("البرنامج لسه ما اتربطش بـ Supabase.");return}
    sb=window.supabase.createClient(cfg.url,cfg.key);
    const{data}=await sb.auth.getSession();
    if(data.session){me=data.session.user;signedIn()}else loginBox()}
  document.readyState==="loading"?document.addEventListener("DOMContentLoaded",start):start();
})();
</script>

<script>
document.documentElement.dir="rtl";document.documentElement.lang="ar";
(function(){
"use strict";
/* ---------- constants ---------- */
const COLS=["projects","parties","accounts","employees","txns","reports"];
const PARTY_KINDS={supplier:"مورد",client:"عميل",contractor:"مقاول باطن"};
const ACC_KINDS={cash:"خزنة",bank:"بنك"};
const STATUS={active:"جاري",paused:"متوقف",done:"منتهي"};
const EXP_CATS=["عمالة يومية","نقل ومشال","إيجار معدات","وقود","كهرباء ومياه","مصاريف إدارية","إكراميات وضيافة","أخرى"];
const TX={
  invoice:{label:"فاتورة توريد",hint:"خامات من مورد لمشروع"},
  expense:{label:"مصروف",hint:"عمالة، نقل، إيجار معدات…"},
  statement:{label:"مستخلص عميل",hint:"أعمال منفذة مستحقة على العميل"},
  collection:{label:"تحصيل من عميل",hint:"فلوس دخلت الخزنة"},
  subwork:{label:"مستخلص مقاول باطن",hint:"أعمال نفذها مقاول باطن"},
  payment:{label:"دفعة لمورد أو مقاول",hint:"سداد من الخزنة"},
  transfer:{label:"تحويل بين الخزن",hint:"من خزنة لبنك أو العكس"},
  salary:{label:"صرف مرتب",hint:"مرتب موظف عن شهر"},
  advance:{label:"سلفة موظف",hint:"بتتخصم من المرتب بعدين"}
};
const VIEWS=[
  {id:"home",label:"الرئيسية",group:"الرئيسية"},
  {id:"daily",label:"التسجيل اليومي",group:"المتابعة"},
  {id:"site",label:"تقارير الموقع",group:"المتابعة",col:"reports"},
  {id:"payroll",label:"المرتبات",group:"المتابعة"},

const S={data:{projects:[],parties:[],accounts:[],employees:[],txns:[],reports:[]},mode:"loading",demo:false,saved:null,view:"home",hist:[],
  f:{dashProject:"",from:"",to:"",payMonth:new Date().toISOString().slice(0,7),incProject:"",siteProject:"",dailyKind:"",dailyProject:"",dailyQ:"",partyKind:"",ledgerAcc:"",stmtParty:""},canWrite:true};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const money=v=>{const x=Math.round(N(v)*100)/100;return x.toLocaleString("en-US",{maximumFractionDigits:2})};
const M=(v,cls)=>`<span class="num ${cls||""}">${money(v)}</span>`;
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(16)+Math.random().toString(16).slice(2)).replace(/[^a-f0-9-]/g,"");
const byId=(col,id)=>S.data[col].find(r=>r.id===id);
const nameOf=(col,id)=>byId(col,id)?.name||"—";
const sortByName=a=>[...a].sort((x,y)=>(x.name||"").localeCompare(y.name||"","ar"));
function toast(t){const el=document.createElement("div");el.className="toast";el.innerHTML=I("check")+"<span></span>";el.lastChild.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function salaryGross(t){return N(t.base)+N(t.bonus)-N(t.deductions)}
function txAmount(t){
  if(t.kind==="invoice") return (t.lines||[]).reduce((s,l)=>s+N(l.qty)*N(l.price),0)-N(t.discount);
  if(t.kind==="salary") return salaryGross(t)-N(t.advanceDeduct);
  return N(t.amount);
}
/* what a movement costs the business (salary counts gross, before advance recovery) */
function costOf(t){return t.kind==="salary"?salaryGross(t):["invoice","expense","subwork"].includes(t.kind)?txAmount(t):0}
function advanceBalance(eid){let b=0;S.data.txns.forEach(t=>{if(t.employeeId!==eid)return;if(t.kind==="advance")b+=N(t.amount);if(t.kind==="salary")b-=N(t.advanceDeduct)});return b}
function inRange(d){const{from,to}=S.f;return(!from||d>=from)&&(!to||d<=to)}

/* ---------- storage ---------- */
const LS_KEY="sanam-local-v1";
function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(j)COLS.forEach(c=>S.data[c]=j[c]||[])}catch(e){}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(S.data))}catch(e){}}
async function put(col,rec){
  if(S.demo){upsertLocal(col,rec);render();return}
  if(S.mode==="db"){const{id,...body}=rec;await db.collection(col).doc(id).set(body);return}
  upsertLocal(col,rec);lsSave();render();
}
async function del(col,id){
  if(S.demo||S.mode!=="db"){S.data[col]=S.data[col].filter(r=>r.id!==id);if(!S.demo)lsSave();render();return}
  await db.collection(col).doc(id).delete();
}
function upsertLocal(col,rec){const a=S.data[col];const i=a.findIndex(r=>r.id===rec.id);if(i>=0)a[i]=rec;else a.push(rec)}

/* ---------- calculations ---------- */
function accountBalances(){
  const b={};S.data.accounts.forEach(a=>b[a.id]=N(a.opening));
  S.data.txns.forEach(t=>{const amt=txAmount(t);
    if(t.kind==="invoice"&&t.pay==="cash"&&t.accountId) b[t.accountId]=(b[t.accountId]||0)-amt;
    if(t.kind==="expense"&&t.accountId) b[t.accountId]=(b[t.accountId]||0)-amt;
    if(t.kind==="collection"&&t.accountId) b[t.accountId]=(b[t.accountId]||0)+amt;
    if((t.kind==="payment"||t.kind==="salary"||t.kind==="advance")&&t.accountId) b[t.accountId]=(b[t.accountId]||0)-amt;
    if(t.kind==="transfer"){if(t.accountId)b[t.accountId]=(b[t.accountId]||0)-amt;if(t.toAccountId)b[t.toAccountId]=(b[t.toAccountId]||0)+amt}
  });return b;
}
function projectStats(pid,ranged){
  const s={revenue:0,collected:0,materials:0,expenses:0,subwork:0,salaries:0};
  S.data.txns.forEach(t=>{if(t.projectId!==pid)return;if(ranged&&!inRange(t.date||""))return;const a=txAmount(t);
    if(t.kind==="statement")s.revenue+=a;if(t.kind==="collection")s.collected+=a;
    if(t.kind==="invoice")s.materials+=a;if(t.kind==="expense")s.expenses+=a;if(t.kind==="subwork")s.subwork+=a;if(t.kind==="salary")s.salaries+=costOf(t);});
  s.cost=s.materials+s.expenses+s.subwork+s.salaries;s.profit=s.revenue-s.cost;s.due=s.revenue-s.collected;return s;
}

/* monthly revenue vs cost, last 6 months */
function monthlySeries(pf){
  const now=new Date();const ms=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push({k:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),label:MONTHS[d.getMonth()],rev:0,cost:0})}
  S.data.txns.forEach(t=>{if(pf&&t.projectId!==pf)return;const m=ms.find(x=>x.k===(t.date||"").slice(0,7));if(!m)return;const a=txAmount(t);
    if(t.kind==="statement")m.rev+=a;m.cost+=costOf(t)});return ms;
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function short(v){const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,"")+" م":a>=1e3?Math.round(v/1e3)+" ألف":String(Math.round(v))}
function barChart(ms){
  const W=640,H=250,pl=58,pr=10,pt=12,pb=30;const max=niceMax(Math.max(...ms.map(m=>Math.max(m.rev,m.cost)),0));
  const cw=(W-pl-pr)/ms.length,bw=Math.min(22,cw*.28),y=v=>pt+(H-pt-pb)*(1-v/max);
  let g="";for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${short(v)}</text>`}
  const bar=(x,v,c)=>{const h=Math.max(0,y(0)-y(v));if(h<=0)return"";const r=Math.min(4,h);return `<path d="M${x},${y(0)} v${-(h-r)} q0,-${r} ${r},-${r} h${bw-2*r} q${r},0 ${r},${r} v${h-r} z" fill="${c}"/>`};
  let b="";ms.forEach((m,i)=>{
    // RTL: first month on the right
    const cx=W-pr-cw*(i+.5);
    b+=`<g class="bar-g" data-i="${i}">${bar(cx+1,m.rev,"var(--c1)")}${bar(cx-bw-1,m.cost,"var(--c2)")}<rect x="${cx-cw/2}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="transparent"/><text x="${cx}" y="${H-8}" text-anchor="middle">${m.label}</text></g>`});
  return `<div class="chart" id="mChart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الإيرادات والتكاليف آخر ٦ شهور">${g}${b}</svg><div class="tip" id="mTip" hidden></div></div>`;
}

function txDesc(t){
  if(t.kind==="transfer")return `من ${esc(nameOf("accounts",t.accountId))} إلى ${esc(nameOf("accounts",t.toAccountId))}`;
  if(t.kind==="salary")return `<b>${esc(nameOf("employees",t.employeeId))}</b> <span class="muted">· عن ${esc(monthName(t.month))}${N(t.advanceDeduct)?" · خصم سلفة "+money(t.advanceDeduct):""}</span>`;
  if(t.kind==="advance")return `<b>${esc(nameOf("employees",t.employeeId))}</b>`+(t.note?` <span class="muted">· ${esc(t.note)}</span>`:"");
  if(t.kind==="expense")return `<b>${esc(t.category||"مصروف")}</b>`+(t.note?` <span class="muted">· ${esc(t.note)}</span>`:"");
  let s=t.partyId?`<b>${esc(nameOf("parties",t.partyId))}</b>`:"";
  if(t.kind==="invoice"){s+=` <span class="pill ${t.pay==="cash"?"t-green":"t-amber"}">${t.pay==="cash"?"نقدي":"آجل"}</span>`;const n=(t.lines||[]).length;if(n)s+=` <span class="muted">· ${n} صنف</span>`}
  if(t.ref)s+=` <span class="muted">· رقم ${esc(t.ref)}</span>`;
  if(t.note)s+=` <span class="muted">· ${esc(t.note)}</span>`;return s;
}

async function shrink(file){
  const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});
    const k=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return {blob:await new Promise(r=>c.toBlob(r,"image/jpeg",.78)),dataUrl:c.toDataURL("image/jpeg",.6)}}finally{URL.revokeObjectURL(url)}
}

/* Detailed statement rows. add raises what we owe (supplier/contractor) or what the client owes us. */
function partyRows(pid){
  const p=byId("parties",pid);if(!p)return[];const rows=[];
  const accN=id=>id?nameOf("accounts",id):"";
  S.data.txns.filter(t=>t.partyId===pid).forEach(t=>{const amt=txAmount(t),pr=t.projectId?nameOf("projects",t.projectId):"";const base={date:t.date||"",project:pr,t};
    const note=t.note?["ملاحظة: "+t.note]:[];
    if(t.kind==="invoice"){
      const items=(t.lines||[]).map(l=>`${l.name||"صنف"}: ${money(l.qty)} ${l.unit||""} × ${money(l.price)} = ${money(N(l.qty)*N(l.price))}`);
      if(N(t.discount))items.push("خصم على الفاتورة: "+money(t.discount));
      rows.push({...base,desc:"فاتورة توريد"+(t.ref?" رقم "+t.ref:"")+(t.pay==="cash"?" (نقدي)":" (آجل)"),details:[...items,...note],add:amt,sub:0});
      if(t.pay==="cash")rows.push({...base,desc:"استلم ثمن الفاتورة نقدي",details:accN(t.accountId)?["من "+accN(t.accountId)]:[],add:0,sub:amt});}
    if(t.kind==="subwork")rows.push({...base,desc:"مستخلص أعمال منفذة",details:note,add:amt,sub:0});
    if(t.kind==="statement")rows.push({...base,desc:"مستخلص"+(t.ref?" رقم "+t.ref:"")+" (أعمال منفذة)",details:note,add:amt,sub:0});
    if(t.kind==="collection")rows.push({...base,desc:"دفع لنا (تحصيل)",details:[accN(t.accountId)?"اتحط في "+accN(t.accountId):"",...note].filter(Boolean),add:0,sub:amt});
    if(t.kind==="payment"){rows.push({...base,desc:"استلم دفعة",details:[accN(t.accountId)?"من "+accN(t.accountId):"",...note].filter(Boolean),add:0,sub:amt});
      if(N(t.discount))rows.push({...base,desc:"خصم مكتسب على الحساب",details:[],add:0,sub:N(t.discount)});}
  });
  rows.sort((a,b)=>a.date.localeCompare(b.date)||(a.t.createdAt||0)-(b.t.createdAt||0));let bal=0;rows.forEach(r=>{bal+=r.add-r.sub;r.bal=bal});return rows;

/* Arabic amount in words for receipts: "فقط ... جنيه مصري لا غير" */
function tafqeet(v){
  const n=Math.floor(Math.abs(N(v))),pt=Math.round((Math.abs(N(v))-n)*100);
  const O=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
  const T=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
  const H=["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
  const g=x=>{const h=Math.floor(x/100),r=x%100,p=[];if(h)p.push(H[h]);if(r){if(r<20)p.push(O[r]);else{const u=r%10;p.push(u?O[u]+" و"+T[Math.floor(r/10)]:T[Math.floor(r/10)])}}return p.join(" و")};
  const sc=[[1e9,"مليار","ملياران","مليارات"],[1e6,"مليون","مليونان","ملايين"],[1e3,"ألف","ألفان","آلاف"]];
  let x=n;const parts=[];
  for(const[s,one,two,few]of sc){const c=Math.floor(x/s);x%=s;if(!c)continue;parts.push(c===1?one:c===2?two:c<=10?g(c)+" "+few:g(c)+" "+one)}
  if(x)parts.push(g(x));
  let out=parts.length?parts.join(" و"):"صفر";out+=" جنيه مصري";if(pt)out+=" و"+g(pt)+" قرش";
  return "فقط "+out+" لا غير";
}

/* ---------- printable sheet → PDF or image (rendered so Arabic shaping stays exact) ---------- */
async function renderSheet({title,meta,html,sign}){
  await ensureLibs();
  const sheet=document.createElement("div");sheet.className="ps";
  sheet.innerHTML=`<div class="ps-h">${PS_LOGO}<div><b>سنام للمقاولات</b><small>${esc(meta||"مقاولات عامة وتشطيبات")}</small></div><div class="ps-t"><b>${esc(title)}</b><small>تاريخ الطباعة: ${fmtDate(today())}</small></div></div>${html}<div class="ps-sign">${(sign||["توقيع المحاسب","توقيع المدير","توقيع المستلم"]).map(x=>`<span>${esc(x)}</span>`).join("")}</div>`;
  sheet.querySelectorAll(".pill svg,.icon-btn,.acts").forEach(x=>x.remove());
  document.body.appendChild(sheet);
  try{
    await document.fonts.ready;
    const scale=2,W=sheet.offsetWidth,pageH=Math.round(W*297/210),top=sheet.getBoundingClientRect().top;
    // cut pages only between rows so no line is split
    const marks=[...sheet.querySelectorAll("tr,.ps-sign,.ps-sum,.ps-words,.ps-info")].map(el=>el.getBoundingClientRect().bottom-top);
    const cuts=[0];let start=0;const total=sheet.scrollHeight;
    while(total-start>pageH){let best=start+pageH;for(const m of marks){if(m>start+60&&m<=start+pageH-20)best=m}cuts.push(best);start=best}
    cuts.push(total);
    const canvas=await html2canvas(sheet,{scale,backgroundColor:"#ffffff",logging:false});
    return {canvas,cuts,W,scale};
  }finally{sheet.remove()}
}

  if(col==="parties"){set("kind","name","phone","notes");need("name","اكتب الاسم")}
  if(col==="reports"){set("date","projectId","engineerId","weather","notes");out.work=($("#m-work").value||"").trim();const pv=v("progress");out.progress=pv===""?"":Math.max(0,Math.min(100,N(pv)));out.workers=v("workers")===""?"":N(v("workers"));
    out.materials=[...document.querySelectorAll("#m-mats .mat")].map(l=>({name:l.querySelector(".mt-name").value.trim(),qty:N(l.querySelector(".mt-qty").value),unit:l.querySelector(".mt-unit").value.trim()})).filter(m=>m.name);
    out.photos=rec.photos||[];need("date","اختار التاريخ");need("projectId","اختار المشروع");if(!out.work&&out.progress===""&&!out.photos.length)throw "اكتب الأعمال المنفذة أو نسبة الإنجاز";}
  if(col==="employees"){set("name","job","projectId","phone","startDate");out.salary=N(v("salary"));out.active=v("active")!=="no";need("name","اكتب اسم الموظف");if(!(out.salary>0))throw "اكتب المرتب الشهري"}
  if(col==="accounts"){set("name","kind");out.opening=N(v("opening"));need("name","اكتب اسم الحساب")}
  if(col==="txns"){set("date","ref","projectId","partyId","category","accountId","toAccountId","note","pay","employeeId","month");
    if(out.kind==="salary"){["base","bonus","deductions","advanceDeduct"].forEach(f=>out[f]=N(v(f)));delete out.amount;}
    if(out.amount!==undefined||$("#m-amount"))out.amount=N(v("amount"));if($("#m-discount"))out.discount=N(v("discount"));
    need("date","اختار التاريخ");const k=out.kind;
    if(["invoice","statement","subwork"].includes(k))need("projectId","اختار المشروع");
    if(["salary","advance"].includes(k))need("employeeId","اختار الموظف");
    if(k==="salary"){need("month","اختار الشهر");if(!(out.base>0))throw "اكتب المرتب الأساسي";if(txAmount(out)<0)throw "الخصومات أكبر من المرتب";
      const dup=S.data.txns.find(t=>t.kind==="salary"&&t.id!==out.id&&t.employeeId===out.employeeId&&t.month===out.month);if(dup)throw "المرتب ده اتصرف قبل كده عن نفس الشهر";}
    if(["invoice","statement","collection","subwork","payment"].includes(k))need("partyId","اختار الجهة");
    if(k==="salary"){}else if(k==="invoice"){out.lines=[...document.querySelectorAll("#m-lines .line")].map(l=>({name:l.querySelector(".ln-name").value.trim(),qty:N(l.querySelector(".ln-qty").value),unit:l.querySelector(".ln-unit").value.trim(),price:N(l.querySelector(".ln-price").value)})).filter(l=>l.name||l.qty||l.price);
      if(!out.lines.length)throw "ضيف صنف واحد على الأقل";if(out.pay==="cash")need("accountId","اختار الخزنة");else delete out.accountId;delete out.amount;}
    else{if(!(out.amount>0))throw "اكتب مبلغ أكبر من صفر"}
    if(["expense","collection","payment","transfer","salary","advance"].includes(k))need("accountId","اختار الخزنة");
    if(k==="transfer"){need("toAccountId","اختار الحساب المحول إليه");if(out.toAccountId===out.accountId)throw "لازم الحسابين يكونوا مختلفين"}
  }
  Object.keys(out).forEach(key=>out[key]===undefined&&delete out[key]);
  if(!out.id){out.id=uid();out.createdAt=Date.now()}out.updatedAt=Date.now();return out;
}
function confirmDelete(col,id){

  const label=col==="txns"?(TX[r.kind]?.label+" بتاريخ "+(r.date||"")+" بمبلغ "+money(txAmount(r))):col==="reports"?"تقرير موقع "+nameOf("projects",r.projectId)+" بتاريخ "+fmtDate(r.date):r.name;

}

/* ---------- CSV / backup ---------- */
async function saveFile(filename,data,mime){
  if(!downloads){toast("التنزيل مش متاح هنا. افتح البرنامج من لينك Claude.");return}
  try{const r=await downloads.save({filename,data:new Blob([data],{type:mime})});toast(r.status==="saved"?"اتحفظ الملف":"الملف اتبعت");return true}
  catch(e){if(e&&e.code!=="declined")toast("الملف ماتحفظش. جرّب تاني.")}
}
function csv(rows){return "﻿"+rows.map(r=>r.map(c=>{const s=String(c??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(",")).join("\r\n")}
function exportCSV(kind){
  let rows,name;
  if(kind==="daily"){const f=S.f;rows=[["التاريخ","النوع","المشروع","الجهة","البيان","المبلغ"]];S.data.txns.filter(t=>(!f.dailyKind||t.kind===f.dailyKind)&&(!f.dailyProject||t.projectId===f.dailyProject)&&inRange(t.date||"")).sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(t=>rows.push([t.date,TX[t.kind]?.label,t.projectId?nameOf("projects",t.projectId):"",t.partyId?nameOf("parties",t.partyId):"",[t.category,t.ref,t.note].filter(Boolean).join(" - "),txAmount(t)]));name="الحركات"}
  if(kind==="compare"){rows=[["المشروع","قيمة العقد","مستخلصات","محصل","مستحق","خامات","مصروفات","مقاولين باطن","مرتبات","إجمالي التكلفة","صافي الربح"]];sortByName(S.data.projects).forEach(p=>{const s=projectStats(p.id,true);rows.push([p.name,N(p.contractValue),s.revenue,s.collected,s.due,s.materials,s.expenses,s.subwork,s.salaries,s.cost,s.profit])});name="مقارنة-المشاريع"}
  if(kind==="income"){rows=[["البند","المبلغ"]];document.querySelectorAll("table.inc tbody tr").forEach(tr=>{const c=tr.querySelectorAll("td");rows.push([c[0].textContent.trim(),(c[1]?.textContent||"").replace(/[(),]/g,"").trim()])});name="قائمة-الدخل"}
  if(kind==="ledger"){const{rows:r}=ledgerRows(S.f.ledgerAcc);rows=[["التاريخ","البيان","المشروع","الحساب","وارد","منصرف","الرصيد"]];r.filter(x=>inRange(x.date)).forEach(x=>rows.push([x.date,x.desc,x.project,nameOf("accounts",x.acc),x.inn,x.out,x.bal]));name="دفتر-الخزنة"}
  if(kind==="stmt"){const st=currentStatement();if(!st)return;const sl=stmtSlice(st);const emp=st.kind==="employee";rows=[["التاريخ","اليوم","البيان","التفاصيل",...(emp?[]:["المشروع"]),...st.cols.filter(Boolean)]];
    if(S.f.from)rows.push(["","","رصيد ما قبل الفترة","",...(emp?["","",""]:["","",""]),sl.open]);
    sl.vis.forEach(x=>rows.push([x.date,dayName(x.date),x.desc,(x.details||[]).join(" | "),...(emp?[x.got||"",x.add||"",x.sub||""]:[x.project,x.add||"",x.sub||""]),x.bal]));name="كشف-حساب-"+st.name}
  saveFile(name.replace(/[\\/:*?"<>|]/g,"")+"-"+today()+".csv",csv(rows),"text/csv");
}
async function restore(file){
  const msg=$("#restoreMsg");
  try{const j=JSON.parse(await file.text());if(!j||j.app!=="sanam")throw 0;let n=0;
    for(const c of COLS)for(const r of (j[c]||[])){if(!r||!r.id)continue;await put(c,r);n++}
    msg.textContent="تم استرجاع "+n+" سجل";msg.className="pos";}
  catch(e){msg.textContent="الملف ده مش نسخة احتياطية من البرنامج.";msg.className="err"}
}

  if(a==="demo"){S.saved=S.data;S.data=demoData();S.demo=true;render();toast("دي بيانات تجريبية");return}
  if(a==="exit-demo"){S.data=S.saved||{projects:[],parties:[],accounts:[],employees:[],txns:[],reports:[]};S.saved=null;S.demo=false;S.f.dashProject="";go("home");return}
  if(a==="month"){const d=new Date();S.f.from=new Date(d.getFullYear(),d.getMonth(),1,12).toISOString().slice(0,10);S.f.to=today();render();return}
  if(a==="allrange"){S.f.from=S.f.to="";render();return}
  if(a.startsWith("csv-")){exportCSV(a.slice(4));return}
  if(a.startsWith("pdf-")||a.startsWith("wa-")){const [m,k]=a.split("-");const spec=sheetFor(k,ds.id);if(!spec)return;b.disabled=true;outputSheet(spec,m==="wa"?"img":"pdf").finally(()=>{b.disabled=false});return}
  if(a==="backup"){const j={app:"sanam",version:1,exportedAt:new Date().toISOString()};COLS.forEach(c=>j[c]=S.data[c]);saveFile("سنام-نسخة-احتياطية-"+today()+".json",JSON.stringify(j,null,1),"application/json").then(ok=>{if(ok){try{localStorage.setItem("sanam-last-backup",new Date().toISOString())}catch(e){}render()}});return}
});
document.addEventListener("submit",async e=>{
  if(e.target.id==="payAllForm"){e.preventDefault();e.target.querySelector('[type="submit"]').disabled=true;await payAll();return}
  if(e.target.id!=="mform")return;e.preventDefault();
  let rec;try{rec=readForm()}catch(m){$("#m-err").textContent=typeof m==="string"?m:"فيه بيانات ناقصة";return}
  const btn=e.target.querySelector('[type="submit"]');btn.disabled=true;
  const col=modalCtx.col;
  try{await put(col,rec);closeModal();toast("اتحفظ")}
  catch(err){btn.disabled=false;$("#m-err").textContent=err&&err.code==="quota_exceeded"?"المساحة اتملت. امسح سجلات قديمة.":err&&err.code==="invalid_argument"?"مش مسموحلك تعدل. صلاحيتك عرض بس.":"ماتحفظش. اتأكد من النت وجرّب تاني."}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.closest&&t.closest("#mform")){if(t.matches(".ln-qty,.ln-price,#m-discount,#m-base,#m-bonus,#m-deductions,#m-advanceDeduct"))updInvoice();return}
  if(t.id==="f-dailyQ"){S.f.dailyQ=t.value;render()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="m-pay"){updInvoice();return}
  if(t.id==="m-employeeId"&&modalCtx&&modalCtx.rec.kind==="salary"){const e=byId("employees",t.value);if(e){$("#m-base").value=e.salary||"";$("#m-projectId").value=e.projectId||"";const b=advanceBalance(e.id);if(b>0&&!$("#m-advanceDeduct").value)$("#m-advanceDeduct").value=b}updSalary();return}
  if(t.id==="m-projectId"&&modalCtx&&modalCtx.rec.kind==="statement"){const c=byId("projects",t.value)?.clientId;const ps=$("#m-partyId");if(c&&ps&&!ps.value)ps.value=c;return}
  if(t.id==="m-photos"&&t.files.length){addPhotos(t.files).finally(()=>{t.value=""});return}
  if(t.id==="m-projectId"&&modalCtx&&modalCtx.col==="reports"){const pg=projectProgress(t.value);const h=$("#m-progHint");if(h)h.textContent=pg!=null?"(آخر تقرير "+Math.round(pg)+"%)":"";return}
  if(t.id==="restoreFile"&&t.files[0]){restore(t.files[0]);return}
  if(t.id&&t.id.startsWith("f-")){S.f[t.id.slice(2)]=t.value;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modalCtx)closeModal()});

/* ---------- boot ---------- */
(async function boot(){
  const h=(location.hash||"").slice(1);if(RENDER[h])S.view=h==="dash"?"home":h;
  const nw=new Date();$("#todayTxt").textContent=DAYS[nw.getDay()]+" "+nw.getDate()+" "+MONTHS[nw.getMonth()]+" "+nw.getFullYear();
  const C=window.claude;
  const [d,u,dl,as]=C&&C.use?await Promise.all([C.use("db"),C.use("user"),C.use("downloads"),C.use("assets")].map(p=>p.catch(()=>null))):[null,null,null,null];
  downloads=dl;assets=as||null;
  if(d){db=d;S.mode="db";
    try{const w=u&&await u.can("data.write");if(w===false)S.canWrite=false}catch(e){}
    const got=new Set();let firstLoad=true;
    try{const me=u&&await u.me();if(me&&me.name)$("#avatar").textContent=initial(me.name)}catch(e){}
    COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{
      const list=snap.docs.map(x=>({id:x.id,...x.data()}));got.add(c);
      // while the demo is showing, live data goes to the saved copy so the demo stays separate
      if(S.demo){if(S.saved)S.saved[c]=list;return}
      S.data[c]=list;if(got.size===COLS.length){if(firstLoad){firstLoad=false;maybeDemo()}render()}
    },()=>toast("الاتصال بالبيانات وقف. اعمل ريفريش للصفحة.")));
  }else{S.mode="local";lsLoad();maybeDemo();render()}
})();
})();
</script>
